# CI — build the artifacts, then run the tests against what was built.
#
# WHY THIS ORDER AND NOT `npm test` ALONE
#
# This package ships `index.js` and `dist/*.js` as COMMITTED BUILD OUTPUT, not as something the
# consumer compiles. So a green test run proves nothing if the committed artifact is stale or
# unbuildable — the tests can pass against `src/` while `index.js` is a version behind. That is the
# exact failure this workflow exists to catch: "tests all green, artifact broken".
#
# So the gate is: rebuild from source → assert the rebuild did not change what is committed →
# run the suite against the bundle that actually ships.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor because `node:sqlite` (used by the optional index tier) lands there.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Check out the siblings the adapter-entry criteria read
        # lead §三十四：paradise 需要 **observer + memory** 两个兄弟仓。
        # 证据：`bare-ignition…:30-31` `import('../../dsh-observer/index.js')`；`v277:32` 读 memory 目录。
        #
        # 依赖图里有两个环（graft↔memory、observer↔paradise），所以**没有哪个仓能靠「自己跑」过关**——
        # 这不是布局瑕疵，是这批判据的主题：两个插件必须对同一份事实保持一致。
        #
        # `repository:` 不带 `ref:` ⇒ 兄弟仓**默认分支 HEAD**，不是本机状态。这带来一个 CI 之前没有的
        # 能力（跨仓漂移会被发现），也意味着「本地全绿 ⇒ CI 绿」不再成立。
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-observer
          path: .siblings/dsh-observer

      - uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-memory
          path: .siblings/dsh-memory

      - name: Place the siblings where the probes expect them
        # `set -e` + `mv` 让失败变响：checkout 没产出目录 ⇒ mv 失败 ⇒ job 红。
        # **不 fallback 成 skip** ——「取不到兄弟」与「兄弟一致」是两件事。
        run: |
          set -e
          mv .siblings/dsh-observer ../dsh-observer
          mv .siblings/dsh-memory ../dsh-memory
          rm -rf .siblings
          node -e "console.log('observer at', require('node:fs').realpathSync('../dsh-observer/index.js'))"
          node -e "console.log('memory at', require('node:fs').realpathSync('../dsh-memory'))"

      - name: Record which sibling revisions these criteria ran against
        # 跨仓判据失败时先看这三行 —— 否则一小时花在错的仓里。
        run: |
          set -e
          for sibling in dsh-observer dsh-memory; do
            echo "sibling $sibling@$(git -C "../$sibling" rev-parse --short HEAD)"
          done

      - name: Runtime dependencies are empty and dev tooling is allowlisted
        # B4-A 的「依赖为空门禁」。dependencies 会装进用户的运行时，必须永远为空；
        # typescript 只能是精确锁版本的 devDependency（干净克隆里缺它的代价已实测）。
        run: node scripts/check-runtime-deps.mjs

      - name: Install (no dependencies expected — this package has none)
        run: npm install --no-audit --no-fund

      - name: Build the bundle and the harness
        run: npm run build:all

      - name: The build must not leave the committed artifacts stale
        # ONLY THE GENERATED FILES ARE CHECKED.
        #
        # `dist/harness-server.js` and `dist/watchdog.js` are HAND-WRITTEN programs that happen to
        # live in `dist/`. Including them here would fail whenever a human edited one without running
        # the build — which is the correct workflow for a file the build does not produce.
        #
        # The first version of this workflow checked all of `dist/`, and the actual failure was
        # different and worse: `.gitignore` excluded the whole directory, so the two programs were
        # NEVER COMMITTED and CI died at `node --check` with `Cannot find module`. The `.gitignore`
        # now whitelists them explicitly; this step names only what the build regenerates.
        #
        # WHY `git diff --exit-code` AND NOT `git status --porcelain`
        #
        # `git status` answers "does the file differ from what the stat cache remembers", and with
        # `core.autocrlf=true` (the default on a Windows clone) it can answer YES for a file whose
        # CONTENT is byte-identical to the committed blob — git wants to convert the worktree file to
        # CRLF "the next time it touches it", and reports that pending conversion as a modification.
        #
        # Measured on a fresh clone of dsh-observer (same build-then-diff gate): after `npm run
        # build`, `git hash-object index.js` equals the committed blob exactly and `git diff
        # --exit-code` exits 0, while `git status --porcelain` still prints ` M index.js`. A gate
        # built on `status` therefore fails a perfectly current artifact on every Windows machine.
        #
        # `git diff --exit-code` compares content after the repo's configured filters, which is the
        # same normalization `git status` applies — so it agrees with `status` on real edits but not
        # on pending-EOL noise. That is exactly the discrimination this gate needs.
        #
        # ⚠️ DO NOT "fix" this by pinning `core.autocrlf=false`. That disables the normalization
        # instead of relying on it, and on a worktree with CRLF bytes it turns pure EOL churn into a
        # whole-file diff. Measured on dsh-memory: `lib/index.js` has 1664 CR bytes in the worktree,
        # plain `git diff` exits 0, and `git -c core.autocrlf=false diff` reports 7 files changed /
        # 7674 insertions / 7674 deletions of NOTHING.
        run: |
          GENERATED="index.js dist/harness.js"
          if ! git diff --exit-code -- $GENERATED; then
            echo "::error::The build changed generated artifacts. Run 'npm run build:all' and commit the result."
            git --no-pager diff --stat -- $GENERATED
            exit 1
          fi
          echo "ok: generated artifacts match what is committed"

      - name: Every entry point the package exposes must exist and parse
        # The documented `bin` targets and `dist/harness.js` are what a user actually runs, so a
        # missing one is a shipped defect. `--check` catches the specific class of failure this
        # project has hit twice: a TypeScript annotation left in a file Node executes directly.
        run: |
          set -e
          for f in dist/harness.js dist/harness-server.js dist/watchdog.js repair-cli.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::missing entry point: $f (is it listed in .gitignore?)"
              exit 1
            fi
            node --check "$f"
            echo "ok: $f"
          done

      - name: Preflight
        run: npm run preflight

      - name: Test
        run: npm test

      # ── THE ARCHITECTURAL GATES THAT DID NOT EXIST HERE UNTIL 2026-11-16 ────────────────────────
      #
      # Measured before this change: this repository had 54 `.ts` files / 15,869 lines / 403 top-level
      # declarations and **zero architectural gates**. `preflight` (14 checks, three of them unique to
      # this layer) was the only thing running, and it answers "can the artifact be loaded", not
      # "is the dependency graph sound" or "did documentation drift".
      #
      # The three scripts below are byte-identical copies of dsh-memory's (verified by SHA-256 in
      # `报告/B0-验收.md`): they take the source root from the repo itself, so their being copied
      # rather than adapted is the point — four repositories, one implementation per criterion.
      #
      # Order: cycles (a structural CAUSE) before documentation counts (a SYMPTOM), same reasoning as
      # graft-slice and observer.
      # ⚠️ 引号是必需的，不是风格：值里的 `: `（冒号+空格）在 YAML 里是 mapping 指示符，
      #    不加引号会让整个 workflow 解析失败（run 创建了但 0 个 job，门禁一条都不跑）。
      #    实测事故：dsh-memory run 44002473416。守护判据：test/v220-workflow-yaml-safe.test.mjs。
      - name: "Gates (new: cycles / type budget / readme counts)"
        # `type-budget` exits 2 when no compiler is present. This package declares no dependencies, so
        # on the runner it usually WILL be 2 — which is a RESOURCE condition, not a pass, and the
        # wrapper prints exactly that and exits 0. On a machine that has a compiler it enforces the
        # frozen baseline (58 code diagnostics, measured 2026-11-16). See docs/gate-wiring.md.
        run: |
          node scripts/check-cycles.mjs
          node scripts/run-gate.mjs scripts/type-budget.mjs
          node scripts/check-readme-counts.mjs
          # Test-file numbers must be unique WITHIN this repository (B4-0b-2 W5-1). Measured
          # 2026-11-21: one number (`v102`) is already shared; that stock is baselined and any NEW
          # collision fails. Same shape as the count gate above: the stock is recorded, growth is
          # refused.
          node scripts/check-test-numbers.mjs
          # check parity: every gate in `npm run check` must also be a CI step (B4-0b-2, 五形态之二
          # 「门禁不咬」). Measured 2026-11-21: the drift had already happened three times across the
          # four repositories.
          node scripts/check-check-parity.mjs

          # ── TD-B1: THE SHIPPED BUNDLE MUST BE WHAT THIS SOURCE BUILDS ─────────────────────────────
          #
          # Measured before this step existed: this repository had ZERO artifact scripts, so
          # 「the shipped bundle is the source」 was a claim nobody could check without a human
          # rebuild and a visual diff. The script rebuilds, then compares every artifact git TRACKS
          # byte for byte — the set that ships is the INDEX's set, not a glob of the build's.
          - name: artifact freshness (committed bundle == source build)
            run: node scripts/check-artifact-fresh.mjs

