# CI — build the artifacts, then run the tests against what was built.
#
# WHY THIS ORDER AND NOT `npm test` ALONE
#
# This package ships `index.js` and `dist/*.js` as COMMITTED BUILD OUTPUT, not as something the
# consumer compiles. So a green test run proves nothing if the committed artifact is stale or
# unbuildable — the tests can pass against `src/` while `index.js` is a version behind. That is the
# exact failure this workflow exists to catch: "tests all green, artifact broken".
#
# So the gate is: rebuild from source → assert the rebuild did not change what is committed →
# run the suite against the bundle that actually ships.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor because `node:sqlite` (used by the optional index tier) lands there.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Install (no dependencies expected — this package has none)
        run: npm install --no-audit --no-fund

      - name: Build the bundle and the harness
        run: npm run build:all

      - name: The build must not leave the committed artifacts stale
        # ONLY THE GENERATED FILES ARE CHECKED.
        #
        # `dist/harness-server.js` and `dist/watchdog.js` are HAND-WRITTEN programs that happen to
        # live in `dist/`. Including them here would fail whenever a human edited one without running
        # the build — which is the correct workflow for a file the build does not produce.
        #
        # The first version of this workflow checked all of `dist/`, and the actual failure was
        # different and worse: `.gitignore` excluded the whole directory, so the two programs were
        # NEVER COMMITTED and CI died at `node --check` with `Cannot find module`. The `.gitignore`
        # now whitelists them explicitly; this step names only what the build regenerates.
        run: |
          GENERATED="index.js dist/harness.js"
          if [ -n "$(git status --porcelain -- $GENERATED)" ]; then
            echo "::error::The build changed generated artifacts. Run 'npm run build:all' and commit the result."
            git --no-pager diff --stat -- $GENERATED
            exit 1
          fi

      - name: Every entry point the package exposes must exist and parse
        # The documented `bin` targets and `dist/harness.js` are what a user actually runs, so a
        # missing one is a shipped defect. `--check` catches the specific class of failure this
        # project has hit twice: a TypeScript annotation left in a file Node executes directly.
        run: |
          set -e
          for f in dist/harness.js dist/harness-server.js dist/watchdog.js repair-cli.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::missing entry point: $f (is it listed in .gitignore?)"
              exit 1
            fi
            node --check "$f"
            echo "ok: $f"
          done

      - name: Preflight
        run: npm run preflight

      - name: Test
        run: npm test
