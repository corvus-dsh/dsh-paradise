# dsh-paradise — insert the layer row.
#
# The layer registers no tools and serves no client half, so the patch is ONE insert with no config.
# It is mounted as its own bundle entry so the Loader can verify its presence and version BEFORE the
# plugins that import it activate — that ordering is the whole reason it is a bundle entry at all.
#
# Place this BEFORE dsh-graft-slice and dsh-observer in the profile's bundles list.
- insert:
    - id: dsh-paradise
      # v2.1.0: the npm name is scoped, so the loader must resolve the SCOPED path. The `id`
      # stays bare because it is a stable handle other patches refer to — changing it would
      # break every existing profile's references for no gain.
      name: '@corvus-dsh/dsh-paradise'
